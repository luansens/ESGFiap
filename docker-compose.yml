services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: esgfiap-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ESGFiap@2024!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "ESGFiap@2024!", "-Q", "SELECT 1", "-No"]
      interval: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esgfiap-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ESGFiap;User Id=sa;Password=ESGFiap@2024!;TrustServerCertificate=True;"
      Jwt__Key: "ESGFiapSuperSecretKey2024!MustBe32Chars"
      Jwt__Issuer: "ESGFiap"
      Jwt__Audience: "ESGFiapUsers"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver_data:
