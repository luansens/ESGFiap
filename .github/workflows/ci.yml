name: CI - ESGFiap

on:
  push:
    branches: [main, ci-cd-github-actions]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependências
        run: dotnet restore ESGFiap.slnx

      - name: Compilar solução
        run: dotnet build ESGFiap.slnx --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test ESGFiap.slnx --configuration Release --no-build
